# Builds release binaries for all platforms when a tag v* is pushed (§15.5).
#
# Signing – one of:
#  - secret NEPOMUK_RELEASE_SIGNING_KEY (OpenSSH private key, ssh-keygen -t ed25519) and, if the key
#    has one, NEPOMUK_RELEASE_SIGNING_PASSPHRASE: the workflow signs SHA256SUMS and publishes the
#    release. Store them in the environment "release", restrict it to tags v* and require a
#    reviewer, so that pushing a tag alone never produces a signed release;
#  - no secret: the release stays a draft; sign it offline with scripts/sign-release.sh.
# Either way the signature must verify against the key embedded in install.sh / install.ps1.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # A signed release is built only from a commit that is on main, for the version in Cargo.toml.
  guard:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is on main and matches the version
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          case "$status" in
            identical|ahead) ;;
            *) echo "::error::$TAG points at $GITHUB_SHA, which is not on main ($status)"; exit 1 ;;
          esac
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          [ "v$version" = "$TAG" ] || { echo "::error::$TAG does not match version $version in Cargo.toml"; exit 1; }

  test:
    needs: guard
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: GUI backend lint
        if: runner.os == 'macOS'
        working-directory: gui/src-tauri
        run: |
          ../scripts/prepare-sidecars.sh
          cargo clippy --locked -- -D warnings
      - name: UI flows in headless Chrome
        if: runner.os == 'Linux'
        run: |
          cargo build --locked
          CHROME=$(command -v google-chrome || command -v chromium) node gui/tests/harness.mjs target/debug/nepomuk "$RUNNER_TEMP/ui-shots"

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true, smoke: false }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, smoke: false }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Check the tag matches Cargo.toml
        run: |
          for f in Cargo.toml gui/src-tauri/Cargo.toml; do
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$f" | head -n1)
            [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match $f version $version"; exit 1; }
          done
          grep -q "\"version\": \"${TAG#v}\"" gui/src-tauri/tauri.conf.json || { echo "tag $TAG does not match tauri.conf.json"; exit 1; }

      - name: Build
        run: |
          # Paths of the build machine must not end up in the binary.
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME/.cargo=/cargo"
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          if [ "${{ matrix.zig }}" = "true" ]; then
            pip install --quiet ziglang==0.16.0
            cargo install --locked cargo-zigbuild@0.23.4
            cargo zigbuild --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi

      - name: Package
        run: |
          exe=nepomuk; [[ "$TARGET" == *windows* ]] && exe=nepomuk.exe
          name="nepomuk-$TAG-$TARGET"
          mkdir -p "stage/$name" dist
          cp "target/$TARGET/release/$exe" LICENSE README.md "stage/$name/"
          if [[ "$TARGET" == *apple-darwin ]]; then
            # Touch ID unlock helper (Secure Enclave), installed next to the CLI.
            arch=${TARGET%%-*}; [ "$arch" = aarch64 ] && arch=arm64
            xcrun swiftc -O -target "$arch-apple-macos11" -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker macos/touchid/Info.plist -o "stage/$name/nepomuk-touchid" macos/touchid/main.swift
          fi
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          if tar --version 2>/dev/null | grep -q GNU; then
            tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
              -C stage -cf - "$name" | gzip -n > "dist/$name.tar.gz"
          else
            tar -C stage -cf - "$name" | gzip -n > "dist/$name.tar.gz"
          fi
          ls -l dist

      - name: Smoke test install.sh
        if: matrix.smoke
        run: |
          # A throwaway key exercises the signature path; the pinned hash path is tested too.
          smoke="$RUNNER_TEMP/smoke"; mkdir -p "$smoke/rel"
          cp dist/*.tar.gz "$smoke/rel/"
          (cd "$smoke/rel" && { sha256sum -- *.tar.gz 2>/dev/null || shasum -a 256 -- *.tar.gz; } > SHA256SUMS)
          ssh-keygen -q -t ed25519 -N '' -f "$smoke/key"
          echo "release@nepomuk $(cut -d' ' -f1,2 "$smoke/key.pub")" > "$smoke/signers"
          ssh-keygen -Y sign -q -n nepomuk-release -f "$smoke/key" "$smoke/rel/SHA256SUMS"
          base="file://$smoke/rel"
          [[ "$TARGET" == *windows* ]] && base="file:///$(cygpath -m "$smoke/rel")"
          sh install.sh --version "$TAG" --base-url "$base" --signers "$smoke/signers" --dir "$smoke/bin-signed"
          "$smoke/bin-signed/nepomuk" version --json
          sum=$(cut -d' ' -f1 "$smoke/rel/SHA256SUMS")
          sh install.sh --version "$TAG" --base-url "$base" --sha256 "$sum" --dir "$smoke/bin-pinned"
          # Without --dir: the default location (~/.local/bin; %LOCALAPPDATA% on Windows).
          if [[ "$TARGET" != *windows* ]]; then
            HOME="$smoke/home" sh install.sh --version "$TAG" --base-url "$base" --sha256 "$sum"
            test -x "$smoke/home/.local/bin/nepomuk"
          fi
          # A tampered archive must be refused.
          printf x >> "$smoke/rel/"*.tar.gz
          if sh install.sh --version "$TAG" --base-url "$base" --signers "$smoke/signers" --dir "$smoke/bin-bad"; then
            echo "tampered archive was installed"; exit 1
          fi

      - name: Smoke test install.ps1
        if: matrix.smoke && runner.os == 'Windows'
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke-ps'
          New-Item -ItemType Directory -Force -Path "$smoke/rel" | Out-Null
          Copy-Item dist/*.tar.gz "$smoke/rel/"
          $archive = Get-ChildItem "$smoke/rel/*.tar.gz" | Select-Object -First 1
          $sum = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$smoke/rel/SHA256SUMS", "$sum  $($archive.Name)`n")
          ssh-keygen -q -t ed25519 -N '' -f "$smoke/key"
          $pub = (Get-Content "$smoke/key.pub") -split ' '
          [IO.File]::WriteAllText("$smoke/signers", "release@nepomuk $($pub[0]) $($pub[1])`n")
          ssh-keygen -Y sign -q -n nepomuk-release -f "$smoke/key" "$smoke/rel/SHA256SUMS"
          ./install.ps1 -Version $env:TAG -BaseUrl "$smoke/rel" -Signers "$smoke/signers" -Dir "$smoke/bin-signed" -NoPath
          & "$smoke/bin-signed/nepomuk.exe" version --json
          ./install.ps1 -Version $env:TAG -BaseUrl "$smoke/rel" -Sha256 $sum -Dir "$smoke/bin-pinned" -NoPath
          # For all users (the runner is an administrator).
          ./install.ps1 -Version $env:TAG -BaseUrl "$smoke/rel" -Sha256 $sum -System -NoPath
          & "$env:ProgramFiles\nepomuk\nepomuk.exe" version --json
          Add-Content -Path $archive.FullName -Value 'x'
          $refused = $false
          try { ./install.ps1 -Version $env:TAG -BaseUrl "$smoke/rel" -Signers "$smoke/signers" -Dir "$smoke/bin-bad" -NoPath } catch { $refused = $true }
          if (-not $refused) { throw 'tampered archive was installed' }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  gui:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, bundles: "app,dmg" }
          - { target: x86_64-apple-darwin, os: macos-latest, bundles: "app,dmg" }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, bundles: "nsis,msi" }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, bundles: "deb,appimage" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Bundled CLI
        run: gui/scripts/prepare-sidecars.sh "$TARGET"
      - name: Build the GUI
        working-directory: gui/src-tauri
        run: |
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME/.cargo=/cargo"
          npx --yes @tauri-apps/cli@2.12.0 build --target "$TARGET" --bundles ${{ matrix.bundles }}
      - name: Collect installers
        run: |
          mkdir -p dist
          b="gui/src-tauri/target/$TARGET/release/bundle"
          for f in "$b"/dmg/*.dmg "$b"/nsis/*.exe "$b"/msi/*.msi "$b"/deb/*.deb "$b"/appimage/*.AppImage; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            cp "$f" "dist/nepomuk-gui-$TAG-$TARGET.$ext"
          done
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, gui]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          # The installers are covered too: `nepomuk upgrade` runs install.sh only when it matches.
          cp ../install.sh ../install.ps1 .
          sha256sum -- * > SHA256SUMS
          grep -q ' install.sh$' SHA256SUMS
          cat SHA256SUMS
          [ "$(ls -- nepomuk-v*.tar.gz | wc -l)" -eq 6 ] || { echo "expected 6 CLI archives"; exit 1; }
          [ "$(ls -- nepomuk-gui-* | wc -l)" -ge 4 ] || { echo "expected GUI installers"; exit 1; }

      - name: Installers carry the same release key
        run: scripts/release-signers.sh check

      - name: Sign
        id: sign
        # The key reaches only this step, not the actions run before it.
        env:
          SIGNING_KEY: ${{ secrets.NEPOMUK_RELEASE_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.NEPOMUK_RELEASE_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No NEPOMUK_RELEASE_SIGNING_KEY – the release stays a draft; sign it with scripts/sign-release.sh $TAG"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release-key"
          trap 'rm -f "$key" "$RUNNER_TEMP/askpass"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          if [ -n "$SIGNING_PASSPHRASE" ]; then
            # ssh-keygen reads the passphrase only through an askpass program.
            askpass="$RUNNER_TEMP/askpass"
            printf '#!/bin/sh\nprintf "%%s\\n" "$SIGNING_PASSPHRASE"\n' > "$askpass"
            chmod 700 "$askpass"
            export SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=none
          fi
          ssh-keygen -Y sign -q -n nepomuk-release -f "$key" dist/SHA256SUMS < /dev/null
          rm -f "$key" "$RUNNER_TEMP/askpass"
          scripts/release-signers.sh verify dist/SHA256SUMS dist/SHA256SUMS.sig
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Create the release
        run: |
          draft=--draft
          [ "${{ steps.sign.outputs.signed }}" = "true" ] && draft=
          gh release create "$TAG" dist/* $draft --verify-tag --title "nepomuk $TAG" \
            --notes "CLI: \`sh install.sh --version $TAG\` (Linux, macOS, Git Bash) or \`./install.ps1 -Version $TAG\` (Windows). GUI: the nepomuk-gui installers (not yet notarized or Authenticode-signed). SHA256SUMS covers every file and is signed with the release key embedded in the installers."
