[package]
name = "nepomuk"
version = "0.4.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aleslanik2/nepomuk"

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
bech32 = "0.12.0"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
libc = "0.2.189"
libcrux-ml-dsa = "0.0.10"
libcrux-ml-kem = "0.0.10"
rand_core = "0.10.1"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
sha2 = "0.11"
sha3 = "0.12.0"
thiserror = "2.0.21"
toml = "1.1.6"
unicode-normalization = "0.1.25"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
