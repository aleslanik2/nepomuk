[package]
name = "nepomuk-gui"
version = "0.2.6"
edition = "2024"
license = "Apache-2.0"
description = "nepomuk GUI – drives the nepomuk CLI (serve --stdio)"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.6"
base64 = "0.22"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
