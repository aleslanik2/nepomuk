[package]
name = "nepomuk-gui"
version = "0.4.4"
edition = "2024"
license = "Apache-2.0"
description = "nepomuk GUI – drives the nepomuk CLI (serve --stdio)"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.6"
base64 = "0.23"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
